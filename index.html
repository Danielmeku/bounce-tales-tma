<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bounce Tales TMA</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js">
    // Safe Telegram Web App Initialization
    const tg = window.Telegram?.WebApp || {};
    if (tg.ready) tg.ready();
    if (tg.expand) tg.expand(); 
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();

    // Helper for Telegram Haptic Feedback (safely falls back if outside Telegram)
    const triggerHaptic = (style = 'light') => {
      if (tg.HapticFeedback && tg.HapticFeedback.impactOccurred) {
         tg.HapticFeedback.impactOccurred(style);
      }
    };
  </script>
  <!-- Phaser 3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #111827;
      overflow: hidden;
      touch-action: none; /* Prevents browser zoom/scroll gestures */
    }
    #game-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    // 1. Initialize Telegram Web App
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // Force full-screen height
    if (tg.disableVerticalSwipes) {
      tg.disableVerticalSwipes(); // Prevent accidental swipe-to-close while playing
    }

    // Helper for Telegram Haptic Feedback
    const triggerHaptic = (style = 'light') => {
      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred(style);
      }
    };

    // 2. Phaser Game Scene
    class BounceScene extends Phaser.Scene {
      constructor() {
        super('BounceScene');
        this.moveLeft = false;
        this.moveRight = false;
        this.jumpPressed = false;
        this.score = 0;
      }

      preload() {
        // Generate procedural textures so this runs with zero external image assets
        const gfx = this.make.graphics({ x: 0, y: 0, add: false });

        // Red Ball (Radius 20)
        gfx.fillStyle(0xef4444, 1);
        gfx.fillCircle(20, 20, 20);
        gfx.fillStyle(0xfca5a5, 0.6); // Highlight
        gfx.fillCircle(14, 14, 6);
        gfx.generateTexture('ball', 40, 40);
        gfx.clear();

        // Ground / Platform Block
        gfx.fillStyle(0x374151, 1);
        gfx.fillRect(0, 0, 64, 32);
        gfx.fillStyle(0x10b981, 1); // Grass top
        gfx.fillRect(0, 0, 64, 6);
        gfx.generateTexture('platform', 64, 32);
        gfx.clear();

        // Golden Ring (Collectible)
        gfx.lineStyle(4, 0xfbbf24, 1);
        gfx.strokeCircle(16, 16, 12);
        gfx.generateTexture('ring', 32, 32);
        gfx.clear();

        // Hazard Spike
        gfx.fillStyle(0x9ca3af, 1);
        gfx.fillTriangle(0, 32, 16, 0, 32, 32);
        gfx.generateTexture('spike', 32, 32);
        gfx.destroy();
      }

      create() {
        const width = this.scale.width;
        const height = this.scale.height;

        // World & Camera bounds (Longer level width)
        this.physics.world.setBounds(0, 0, 2400, height);
        this.cameras.main.setBounds(0, 0, 2400, height);

        // Platforms
        this.platforms = this.physics.add.staticGroup();
        // Create main floor
        for (let x = 0; x < 2400; x += 64) {
          // Leave a gap around x = 700
          if (x < 640 || x > 832) {
            this.platforms.create(x + 32, height - 16, 'platform');
          }
        }
        // Floating platforms
        this.platforms.create(350, height - 130, 'platform').setScale(2, 1).refreshBody();
        this.platforms.create(736, height - 160, 'platform').setScale(1.5, 1).refreshBody();
        this.platforms.create(1150, height - 140, 'platform').setScale(2, 1).refreshBody();

        // Player (Bouncing Red Ball)
        this.player = this.physics.add.sprite(120, height - 100, 'ball');
        this.player.setCircle(20); // Circular hitbox
        this.player.setBounce(0.55); // Classic bouncy feel
        this.player.setCollideWorldBounds(true);
        this.player.setDragX(600);
        this.player.setMaxVelocity(350, 900);

        // Collectibles (Rings)
        this.rings = this.physics.add.staticGroup();
        this.rings.create(350, height - 180, 'ring');
        this.rings.create(736, height - 210, 'ring');
        this.rings.create(1150, height - 190, 'ring');

        // Hazards (Spikes)
        this.spikes = this.physics.add.staticGroup();
        this.spikes.create(520, height - 48, 'spike');
        this.spikes.create(1000, height - 48, 'spike');

        // Collisions
        this.physics.add.collider(this.player, this.platforms, () => {
          // Slight haptic feedback on hard landings
          if (this.player.body.velocity.y > 250) {
            triggerHaptic('light');
          }
        });

        this.physics.add.overlap(this.player, this.rings, (player, ring) => {
          ring.destroy();
          this.score += 100;
          this.scoreText.setText(`Rings: ${this.score / 100}`);
          triggerHaptic('medium');
        });

        this.physics.add.overlap(this.player, this.spikes, () => {
          triggerHaptic('heavy');
          this.scene.restart(); // Reset level on spike hit
        });

        // Camera follow
        this.cameras.main.startFollow(this.player, true, 0.08, 0.08);

        // Keyboard controls (for desktop testing)
        this.cursors = this.input.keyboard.createCursorKeys();

        // UI & Mobile Touch Controls (Fixed to camera)
        this.scoreText = this.add.text(20, 20, 'Rings: 0', {
          fontSize: '20px',
          fontFamily: 'sans-serif',
          fill: '#ffffff',
          fontStyle: 'bold'
        }).setScrollFactor(0);

        this.createTouchControls(width, height);
      }

      createTouchControls(width, height) {
        this.input.addPointer(2); // Support multi-touch (move + jump simultaneously)

        const btnStyle = { alpha: 0.35, color: 0xffffff };
        const btnY = height - 65;

        // Left Button
        const leftBtn = this.add.circle(65, btnY, 38, btnStyle.color, btnStyle.alpha)
          .setScrollFactor(0)
          .setInteractive();
        this.add.text(55, btnY - 12, '◀', { fontSize: '24px', fill: '#111827' }).setScrollFactor(0);

        leftBtn.on('pointerdown', () => { this.moveLeft = true; leftBtn.setAlpha(0.6); });
        leftBtn.on('pointerup', () => { this.moveLeft = false; leftBtn.setAlpha(btnStyle.alpha); });
        leftBtn.on('pointerout', () => { this.moveLeft = false; leftBtn.setAlpha(btnStyle.alpha); });

        // Right Button
        const rightBtn = this.add.circle(160, btnY, 38, btnStyle.color, btnStyle.alpha)
          .setScrollFactor(0)
          .setInteractive();
        this.add.text(152, btnY - 12, '▶', { fontSize: '24px', fill: '#111827' }).setScrollFactor(0);

        rightBtn.on('pointerdown', () => { this.moveRight = true; rightBtn.setAlpha(0.6); });
        rightBtn.on('pointerup', () => { this.moveRight = false; rightBtn.setAlpha(btnStyle.alpha); });
        rightBtn.on('pointerout', () => { this.moveRight = false; rightBtn.setAlpha(btnStyle.alpha); });

        // Jump Button
        const jumpBtn = this.add.circle(width - 70, btnY, 42, 0xef4444, 0.5)
          .setScrollFactor(0)
          .setInteractive();
        this.add.text(width - 82, btnY - 12, '▲', { fontSize: '24px', fill: '#ffffff' }).setScrollFactor(0);

        jumpBtn.on('pointerdown', () => { this.jumpPressed = true; jumpBtn.setAlpha(0.8); });
        jumpBtn.on('pointerup', () => { this.jumpPressed = false; jumpBtn.setAlpha(0.5); });
        jumpBtn.on('pointerout', () => { this.jumpPressed = false; jumpBtn.setAlpha(0.5); });
      }

      update() {
        const height = this.scale.height;

        // Horizontal Movement & Ball Roll Rotation
        if (this.moveLeft || this.cursors.left.isDown) {
          this.player.setAccelerationX(-900);
          this.player.angle -= 6;
        } else if (this.moveRight || this.cursors.right.isDown) {
          this.player.setAccelerationX(900);
          this.player.angle += 6;
        } else {
          this.player.setAccelerationX(0);
          // Gradually slow down rotation based on horizontal velocity
          this.player.angle += this.player.body.velocity.x * 0.02;
        }

        // Jump (only when touching the ground)
        const isGrounded = this.player.body.blocked.down || this.player.body.touching.down;
        if ((this.jumpPressed || this.cursors.up.isDown) && isGrounded) {
          this.player.setVelocityY(-520);
          triggerHaptic('light');
        }

        // Fall into pit check
        if (this.player.y > height - 22) {
          triggerHaptic('heavy');
          this.scene.restart();
        }
      }
    }

    // 3. Phaser Configuration
    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      backgroundColor: '#1f2937',
      scale: {
        mode: Phaser.Scale.RESIZE,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: window.innerWidth,
        height: window.innerHeight
      },
      physics: {
        default: 'arcade',
        arcade: {
          gravity: { y: 950 },
          debug: false
        }
      },
      scene: [BounceScene]
    };

    new Phaser.Game(config);
  </script>
</body>
</html>
