<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bounce Tales TMA - Full Stage</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body { background-color: #0f172a; overflow: hidden; touch-action: none; }
    #game-container { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    // Safe Telegram Web App Initialization
    const tg = window.Telegram?.WebApp || {};
    if (tg.ready) tg.ready();
    if (tg.expand) tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();

    const triggerHaptic = (style = 'light') => {
      if (tg.HapticFeedback?.impactOccurred) {
        tg.HapticFeedback.impactOccurred(style);
      }
    };

    class BounceScene extends Phaser.Scene {
      constructor() {
        super('BounceScene');
        this.moveLeft = false;
        this.moveRight = false;
        this.jumpPressed = false;
        this.score = 0;
        this.totalRings = 0;
        this.ballForm = 'normal'; // 'normal' | 'rock' | 'beach'
        this.levelComplete = false;
      }

      preload() {
        const gfx = this.make.graphics({ x: 0, y: 0, add: false });

        // 1. Normal Red Ball
        gfx.fillStyle(0xef4444, 1);
        gfx.fillCircle(20, 20, 20);
        gfx.fillStyle(0xfca5a5, 0.6);
        gfx.fillCircle(14, 14, 6);
        gfx.generateTexture('ball-normal', 40, 40);
        gfx.clear();

        // 2. Heavy Rock Ball
        gfx.fillStyle(0x64748b, 1);
        gfx.fillCircle(22, 22, 22);
        gfx.lineStyle(3, 0x334155, 1);
        gfx.strokeCircle(22, 22, 20);
        gfx.fillStyle(0x94a3b8, 0.7);
        gfx.fillCircle(14, 14, 5);
        gfx.generateTexture('ball-rock', 44, 44);
        gfx.clear();

        // 3. Beach Ball (Striped)
        gfx.fillStyle(0x38bdf8, 1);
        gfx.fillCircle(22, 22, 22);
        gfx.fillStyle(0xfacc15, 1);
        gfx.fillCircle(22, 22, 12);
        gfx.fillStyle(0xffffff, 0.8);
        gfx.fillCircle(15, 13, 5);
        gfx.generateTexture('ball-beach', 44, 44);
        gfx.clear();

        // 4. Ground / Platform Block
        gfx.fillStyle(0x334155, 1);
        gfx.fillRect(0, 0, 64, 32);
        gfx.fillStyle(0x10b981, 1);
        gfx.fillRect(0, 0, 64, 6);
        gfx.generateTexture('platform', 64, 32);
        gfx.clear();

        // 5. Golden Ring
        gfx.lineStyle(4, 0xfbbf24, 1);
        gfx.strokeCircle(16, 16, 12);
        gfx.generateTexture('ring', 32, 32);
        gfx.clear();

        // 6. Hazard Spike
        gfx.fillStyle(0x94a3b8, 1);
        gfx.fillTriangle(0, 32, 16, 0, 32, 32);
        gfx.generateTexture('spike', 32, 32);
        gfx.clear();

        // 7. Transformer Pads
        gfx.fillStyle(0x64748b, 1);
        gfx.fillRoundedRect(0, 0, 36, 36, 8);
        gfx.lineStyle(2, 0xffffff, 1);
        gfx.strokeRoundedRect(2, 2, 32, 32, 8);
        gfx.generateTexture('pad-rock', 36, 36);
        gfx.clear();

        gfx.fillStyle(0x0ea5e9, 1);
        gfx.fillRoundedRect(0, 0, 36, 36, 8);
        gfx.lineStyle(2, 0xfacc15, 1);
        gfx.strokeRoundedRect(2, 2, 32, 32, 8);
        gfx.generateTexture('pad-beach', 36, 36);
        gfx.clear();

        gfx.fillStyle(0xef4444, 1);
        gfx.fillRoundedRect(0, 0, 36, 36, 8);
        gfx.lineStyle(2, 0xffffff, 1);
        gfx.strokeRoundedRect(2, 2, 32, 32, 8);
        gfx.generateTexture('pad-normal', 36, 36);
        gfx.clear();

        // 8. Checkpoint Flag
        gfx.fillStyle(0xf8fafc, 1);
        gfx.fillRect(4, 0, 4, 48);
        gfx.fillStyle(0xa855f7, 1);
        gfx.fillTriangle(8, 4, 32, 14, 8, 24);
        gfx.generateTexture('checkpoint', 36, 48);
        gfx.clear();

        // 9. Goal Portal
        gfx.lineStyle(5, 0x22c55e, 1);
        gfx.strokeEllipse(24, 36, 36, 64);
        gfx.lineStyle(3, 0x86efac, 0.8);
        gfx.strokeEllipse(24, 36, 22, 44);
        gfx.generateTexture('portal', 48, 72);
        gfx.destroy();
      }

      create() {
        const width = this.scale.width;
        const height = this.scale.height;
        const worldWidth = 4800;

        this.levelComplete = false;
        this.score = 0;
        this.ballForm = 'normal';
        this.spawnPoint = { x: 100, y: height - 100, form: 'normal' };

        this.physics.world.setBounds(0, 0, worldWidth, height);
        this.cameras.main.setBounds(0, 0, worldWidth, height);

        // Groups
        this.platforms = this.physics.add.staticGroup();
        this.rings = this.physics.add.staticGroup();
        this.spikes = this.physics.add.staticGroup();
        this.transformers = this.physics.add.staticGroup();
        this.checkpoints = this.physics.add.staticGroup();

        // --- BUILD FLOOR WITH GAPS & WATER POOLS ---
        // Water Pool zone between x = 3100 and x = 3700
        this.waterZone = this.add.rectangle(3400, height - 65, 600, 130, 0x0284c7, 0.45);
        this.physics.add.existing(this.waterZone, true);

        for (let x = 0; x < worldWidth; x += 64) {
          // Pit 1 (x: 640 - 832)
          if (x >= 640 && x <= 832) continue;
          // Pit 2 (x: 1920 - 2112)
          if (x >= 1920 && x <= 2112) continue;
          // Water Pool Floor (lowered floor so ball swims inside)
          if (x >= 3100 && x <= 3700) {
            this.platforms.create(x + 32, height - 8, 'platform');
            continue;
          }
          this.platforms.create(x + 32, height - 16, 'platform');
        }

        // --- STAGE 1: MEADOW (0 - 1500) ---
        this.add.text(100, height - 220, 'STAGE 1: MEADOW', { fontSize: '18px', fill: '#94a3b8', fontStyle: 'bold' });
        this.platforms.create(350, height - 120, 'platform').setScale(2, 1).refreshBody();
        this.platforms.create(736, height - 150, 'platform').setScale(1.5, 1).refreshBody();
        this.platforms.create(1150, height - 130, 'platform').setScale(2, 1).refreshBody();

        this.spikes.create(520, height - 48, 'spike');
        this.spikes.create(1000, height - 48, 'spike');

        this.rings.create(350, height - 170, 'ring');
        this.rings.create(736, height - 200, 'ring');
        this.rings.create(1150, height - 180, 'ring');

        // Checkpoint 1
        this.checkpoints.create(1450, height - 56, 'checkpoint');

        // --- STAGE 2: HEAVY ROCK CAVE (1500 - 3000) ---
        this.add.text(1520, height - 240, 'STAGE 2: ROCK BALL\n(Heavy • Crushes Spikes)', { fontSize: '16px', fill: '#cbd5e1', fontStyle: 'bold' });
        this.transformers.create(1560, height - 50, 'pad-rock').setData('type', 'rock');

        // Moving Platform over Pit 2
        this.movingPlatform = this.physics.add.image(2016, height - 110, 'platform').setScale(2, 1);
        this.movingPlatform.setImmovable(true);
        this.movingPlatform.body.allowGravity = false;
        this.tweens.add({
          targets: this.movingPlatform,
          y: height - 220,
          duration: 1800,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut'
        });

        // Spike gauntlet that Rock Ball can smash right through!
        for (let sx = 2300; sx <= 2556; sx += 32) {
          this.spikes.create(sx, height - 48, 'spike');
        }
        this.rings.create(2428, height - 90, 'ring');
        this.rings.create(2016, height - 260, 'ring');

        // Checkpoint 2
        this.checkpoints.create(2850, height - 56, 'checkpoint');

        // --- STAGE 3: AQUA LAGOON (3000 - 4800) ---
        this.add.text(2920, height - 240, 'STAGE 3: BEACH BALL\n(Floaty • Swims in Water)', { fontSize: '16px', fill: '#38bdf8', fontStyle: 'bold' });
        this.transformers.create(2960, height - 50, 'pad-beach').setData('type', 'beach');

        // Rings suspended in and above the water pool
        this.rings.create(3250, height - 90, 'ring');
        this.rings.create(3400, height - 180, 'ring');
        this.rings.create(3550, height - 90, 'ring');

        // Switch back to Normal Red Ball for the final climb
        this.transformers.create(3820, height - 50, 'pad-normal').setData('type', 'normal');
        this.platforms.create(4050, height - 110, 'platform').setScale(1.5, 1).refreshBody();
        this.platforms.create(4280, height - 190, 'platform').setScale(1.5, 1).refreshBody();
        this.platforms.create(4520, height - 260, 'platform').setScale(2, 1).refreshBody();

        this.rings.create(4050, height - 160, 'ring');
        this.rings.create(4280, height - 240, 'ring');

        // Goal Portal
        this.portal = this.physics.add.staticSprite(4540, height - 312, 'portal');

        this.totalRings = this.rings.getChildren().length;

        // --- PLAYER SETUP ---
        this.player = this.physics.add.sprite(this.spawnPoint.x, this.spawnPoint.y, 'ball-normal');
        this.player.setCircle(20);
        this.player.setCollideWorldBounds(true);
        this.applyBallForm('normal');

        // --- COLLISIONS & OVERLAPS ---
        this.physics.add.collider(this.player, this.platforms, () => {
          if (this.player.body.velocity.y > 260) triggerHaptic('light');
        });
        this.physics.add.collider(this.player, this.movingPlatform);

        // Ring Collection
        this.physics.add.overlap(this.player, this.rings, (player, ring) => {
          ring.destroy();
          this.score += 1;
          this.scoreText.setText(`Rings: ${this.score} / ${this.totalRings}`);
          triggerHaptic('medium');
        });

        // Ball Form Transformers
        this.physics.add.overlap(this.player, this.transformers, (player, pad) => {
          const newForm = pad.getData('type');
          if (this.ballForm !== newForm) {
            this.applyBallForm(newForm);
            triggerHaptic('medium');
          }
        });

        // Checkpoints
        this.physics.add.overlap(this.player, this.checkpoints, (player, flag) => {
          if (!flag.getData('activated')) {
            flag.setData('activated', true);
            flag.setTint(0x22c55e);
            this.spawnPoint = { x: flag.x, y: flag.y - 20, form: this.ballForm };
            this.showToast('Checkpoint Saved!');
            triggerHaptic('medium');
          }
        });

        // Spikes (Rock ball destroys them; other forms respawn at checkpoint)
        this.physics.add.overlap(this.player, this.spikes, (player, spike) => {
          if (this.ballForm === 'rock') {
            spike.destroy();
            triggerHaptic('light');
          } else {
            this.respawnPlayer();
          }
        });

        // Goal Portal
        this.physics.add.overlap(this.player, this.portal, () => {
          if (!this.levelComplete) {
            this.levelComplete = true;
            this.handleLevelComplete();
          }
        });

        // Camera & Controls
        this.cameras.main.startFollow(this.player, true, 0.08, 0.08);
        this.cursors = this.input.keyboard.createCursorKeys();

        // HUD
        this.scoreText = this.add.text(20, 20, `Rings: 0 / ${this.totalRings}`, {
          fontSize: '18px', fontFamily: 'sans-serif', fill: '#ffffff', fontStyle: 'bold'
        }).setScrollFactor(0);

        this.formText = this.add.text(20, 45, 'Form: Red Ball', {
          fontSize: '14px', fontFamily: 'sans-serif', fill: '#fca5a5'
        }).setScrollFactor(0);

        this.toastText = this.add.text(width / 2, 80, '', {
          fontSize: '18px', fontFamily: 'sans-serif', fill: '#4ade80', fontStyle: 'bold'
        }).setOrigin(0.5).setScrollFactor(0);

        this.createTouchControls(width, height);
      }

      applyBallForm(form) {
        this.ballForm = form;
        if (form === 'normal') {
          this.player.setTexture('ball-normal');
          this.player.setCircle(20);
          this.player.setBounce(0.55);
          this.player.setDragX(600);
          this.player.setMaxVelocity(360, 900);
          this.player.body.setGravityY(0);
          this.jumpVelocity = -530;
          this.moveAccel = 950;
          if (this.formText) this.formText.setText('Form: Red Ball').setFill('#fca5a5');
        } else if (form === 'rock') {
          this.player.setTexture('ball-rock');
          this.player.setCircle(22);
          this.player.setBounce(0.12); // Hardly bounces
          this.player.setDragX(900);
          this.player.setMaxVelocity(260, 1200);
          this.player.body.setGravityY(550); // Extra heavy
          this.jumpVelocity = -440;
          this.moveAccel = 750;
          if (this.formText) this.formText.setText('Form: Rock Ball (Heavy)').setFill('#cbd5e1');
        } else if (form === 'beach') {
          this.player.setTexture('ball-beach');
          this.player.setCircle(22);
          this.player.setBounce(0.75); // Extra bouncy
          this.player.setDragX(350);
          this.player.setMaxVelocity(320, 500);
          this.player.body.setGravityY(-350); // Floaty low gravity
          this.jumpVelocity = -430;
          this.moveAccel = 700;
          if (this.formText) this.formText.setText('Form: Beach Ball (Floaty)').setFill('#38bdf8');
        }
      }

      respawnPlayer() {
        triggerHaptic('heavy');
        this.cameras.main.shake(150, 0.01);
        this.player.setVelocity(0, 0);
        this.player.setPosition(this.spawnPoint.x, this.spawnPoint.y);
        this.applyBallForm(this.spawnPoint.form);
      }

      showToast(msg) {
        this.toastText.setText(msg);
        this.time.delayedCall(1800, () => {
          if (this.toastText) this.toastText.setText('');
        });
      }

      handleLevelComplete() {
        triggerHaptic('heavy');
        this.player.setVelocity(0, 0);
        this.player.body.moves = false;

        const w = this.scale.width;
        const h = this.scale.height;

        this.add.rectangle(w / 2, h / 2, w * 0.82, 220, 0x0f172a, 0.92)
          .setStrokeStyle(2, 0x22c55e)
          .setScrollFactor(0);

        this.add.text(w / 2, h / 2 - 55, 'LEVEL COMPLETE!', {
          fontSize: '26px', fontFamily: 'sans-serif', fill: '#4ade80', fontStyle: 'bold'
        }).setOrigin(0.5).setScrollFactor(0);

        this.add.text(w / 2, h / 2 - 10, `Rings Collected: ${this.score} / ${this.totalRings}`, {
          fontSize: '18px', fontFamily: 'sans-serif', fill: '#ffffff'
        }).setOrigin(0.5).setScrollFactor(0);

        const replayBtn = this.add.text(w / 2, h / 2 + 45, '↻ Play Again', {
          fontSize: '18px', fontFamily: 'sans-serif', fill: '#0f172a',
          backgroundColor: '#22c55e', padding: { x: 18, y: 10 }
        }).setOrigin(0.5).setScrollFactor(0).setInteractive();

        replayBtn.on('pointerdown', () => this.scene.restart());
      }

      createTouchControls(width, height) {
        this.input.addPointer(2);
        const btnY = height - 65;

        const leftBtn = this.add.circle(65, btnY, 38, 0xffffff, 0.3).setScrollFactor(0).setInteractive();
        this.add.text(55, btnY - 12, '◀', { fontSize: '24px', fill: '#0f172a' }).setScrollFactor(0);
        leftBtn.on('pointerdown', () => { this.moveLeft = true; leftBtn.setAlpha(0.6); });
        leftBtn.on('pointerup', () => { this.moveLeft = false; leftBtn.setAlpha(0.3); });
        leftBtn.on('pointerout', () => { this.moveLeft = false; leftBtn.setAlpha(0.3); });

        const rightBtn = this.add.circle(160, btnY, 38, 0xffffff, 0.3).setScrollFactor(0).setInteractive();
        this.add.text(152, btnY - 12, '▶', { fontSize: '24px', fill: '#0f172a' }).setScrollFactor(0);
        rightBtn.on('pointerdown', () => { this.moveRight = true; rightBtn.setAlpha(0.6); });
        rightBtn.on('pointerup', () => { this.moveRight = false; rightBtn.setAlpha(0.3); });
        rightBtn.on('pointerout', () => { this.moveRight = false; rightBtn.setAlpha(0.3); });

        const jumpBtn = this.add.circle(width - 70, btnY, 42, 0xef4444, 0.5).setScrollFactor(0).setInteractive();
        this.add.text(width - 82, btnY - 12, '▲', { fontSize: '24px', fill: '#ffffff' }).setScrollFactor(0);
        jumpBtn.on('pointerdown', () => { this.jumpPressed = true; jumpBtn.setAlpha(0.8); });
        jumpBtn.on('pointerup', () => { this.jumpPressed = false; jumpBtn.setAlpha(0.5); });
        jumpBtn.on('pointerout', () => { this.jumpPressed = false; jumpBtn.setAlpha(0.5); });
      }

      update() {
        if (this.levelComplete) return;
        const height = this.scale.height;

        // Horizontal Movement
        if (this.moveLeft || this.cursors.left.isDown) {
          this.player.setAccelerationX(-this.moveAccel);
          this.player.angle -= 6;
        } else if (this.moveRight || this.cursors.right.isDown) {
          this.player.setAccelerationX(this.moveAccel);
          this.player.angle += 6;
        } else {
          this.player.setAccelerationX(0);
          this.player.angle += this.player.body.velocity.x * 0.02;
        }

        // Water Buoyancy Logic (Stage 3)
        const inWater = Phaser.Geom.Intersects.RectangleToRectangle(this.player.getBounds(), this.waterZone.getBounds());
        if (inWater) {
          if (this.ballForm === 'beach') {
            // Beach ball floats upward in water!
            this.player.setAccelerationY(-1450);
          } else if (this.ballForm === 'rock') {
            // Rock ball sinks straight to the bottom
            this.player.setAccelerationY(400);
          }
        } else {
          this.player.setAccelerationY(0);
        }

        // Jump
        const isGrounded = this.player.body.blocked.down || this.player.body.touching.down;
        if ((this.jumpPressed || this.cursors.up.isDown) && (isGrounded || (inWater && this.ballForm === 'beach'))) {
          this.player.setVelocityY(inWater ? -250 : this.jumpVelocity);
          if (isGrounded) triggerHaptic('light');
        }

        // Pit Fall Respawn
        if (this.player.y > height - 22 && !inWater) {
          this.respawnPlayer();
        }
      }
    }

    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      backgroundColor: '#1e293b',
      scale: {
        mode: Phaser.Scale.RESIZE,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: window.innerWidth,
        height: window.innerHeight
      },
      physics: {
        default: 'arcade',
        arcade: { gravity: { y: 950 }, debug: false }
      },
      scene: [BounceScene]
    };

    new Phaser.Game(config);
  </script>
</body>
</html>
